[package]
name = "magicmtn-provider-modal"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Modal sandbox provider for MagicMtn"
repository = "https://github.com/useMagicMtn/provider-modal"
readme = "README.md"
keywords = ["magicmtn", "modal", "sandbox"]
include = [
    "/.cargo/config.toml.example",
    "/.github/assets/*.svg",
    "/src/*.rs",
    "/src/modal_bridge.py",
    "/tests/*.py",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/USAGE.md",
    "/requirements.lock",
    "/requirements.txt",
    "/package.sh",
]

[package.metadata.magicmtn]
protocol-version = 2

[[bin]]
name = "magicmtn-provider-modal"
path = "src/main.rs"
required-features = ["plugin"]

[features]
default = ["plugin"]
plugin = ["dep:magicmtn-provider-framework", "tokio/macros", "tokio/rt"]

[dependencies]
magicmtn-sdk = "0.1.0"
magicmtn-provider-framework = { version = "0.1.0", optional = true }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time"] }
uuid = "1"
zeroize = "1.8"
